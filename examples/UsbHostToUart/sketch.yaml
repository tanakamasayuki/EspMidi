# One USB host port and one USB device port at once needs two USB peripherals, so
# the target is the ESP32-P4.
profiles:
  esp32p4:
    fqbn: esp32:esp32:esp32p4
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../
      - EspUsbHost (2.7.5)
      - EspUsbDevice (2.0.2)

  esp32p4_local:
    fqbn: esp32:esp32:esp32p4
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../
      - dir: ../../../EspUsbHost
      - dir: ../../../EspUsbDevice

default_profile: esp32p4
