name=EspMidi
version=0.1.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Route MIDI between USB Host, USB Device, BLE and UART on ESP32: merge, split, filter and transform in between.
paragraph=EspMidi sits between the MIDI interfaces an ESP32 can reach. It registers the MIDI inputs and outputs offered by EspUsbHost, EspUsbDevice, EspBle and its own UART port as one kind of logical port, then routes messages between them: one to one, one to many, many to one, or any combination, with filtering and basic channel/note/velocity transformation on the way. It does not own the USB or BLE stack, so MIDI can coexist with HID, CDC, Audio and custom GATT services in the same sketch. The core is portable C++ with no Arduino, ESP-IDF or hardware dependency; ports are header-only, so a sketch needs EspUsbHost, EspUsbDevice or EspBle only for the ports it includes.
category=Communication
