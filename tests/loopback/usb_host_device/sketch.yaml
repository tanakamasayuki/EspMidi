# One ESP32-P4: it has two USB peripherals, so the same board can be a USB MIDI
# device and a USB MIDI host at once. Its two connectors have to be joined —
# unlike the UART loopback, this one needs wiring.
#
# The console is UART0 (the board's external USB-serial chip), so neither USB
# peripheral is spent on it.
profiles:
  p4_loopback:
    fqbn: esp32:esp32:esp32p4
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.7.5)
      - EspUsbDevice (2.0.2)

  p4_loopback_local:
    fqbn: esp32:esp32:esp32p4
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - dir: ../../../../EspUsbHost
      - dir: ../../../../EspUsbDevice

default_profile: p4_loopback
