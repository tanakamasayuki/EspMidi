profiles:
  # One ESP32-S3, no wiring: the GPIO matrix puts UART1_TX and UART2_RX on the
  # same pin. The console is UART0, the board's external USB-serial chip, and
  # nothing here touches USB, so the board options stay at their defaults.
  s3_loopback:
    fqbn: esp32:esp32:esp32s3
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: s3_loopback
