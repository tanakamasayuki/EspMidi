# BLE MIDI needs no wiring, but it uses the same peer pair. The BLE MIDI profile
# is in released EspBle.
profiles:
  s3_peer_host:
    fqbn: esp32:esp32:esp32s3
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspBle (1.2.0)

  s3_peer_local:
    fqbn: esp32:esp32:esp32s3
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - dir: ../../../../EspBle

default_profile: s3_peer_host
