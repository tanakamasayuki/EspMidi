# Cable discovery (getMidiPortInfo()) shipped in EspUsbHost 2.7.5, so the DUT
# builds against the published version. The *_local profile is kept alongside it
# for checking against a development checkout (decision 5 in
# docs/DECISIONS.ja.md).
profiles:
  s3_peer_host:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbHost (2.7.5)

  s3_peer_local:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../../EspUsbHost

default_profile: s3_peer_host
