# The board that arduino_smoke/ and the other manual work uses
# (TEST_SERIAL_PORT_ESP32S3). The USB peripheral runs the host side, which is
# what the MIDI interface is plugged into, so the console is UART0 — the board's
# external USB-serial chip.
profiles:
  esp32s3:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbHost (2.7.5)

default_profile: esp32s3
